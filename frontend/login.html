<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GrandStay</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-container {
            max-width: 420px;
            margin: 55px auto;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px #00000015;
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #667085;
            margin-bottom: 20px;
        }

        .login-container label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .login-container button {
            width: 100%;
            margin-top: 22px;
        }

        .login-container .message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <nav class="navbar">
        <h2 class="logo">GrandStay</h2>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>
</header>

<main class="login-container">
    <h1>Welcome Back</h1>
    <p>Login to manage your hotel bookings.</p>

    <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>
        <p class="message" id="message" role="status"></p>
    </form>

    <p>Don't have an account? <a href="register.html">Register here</a></p>
</main>

<footer>
    <p>&copy; 2026 GrandStay Hotel. All rights reserved.</p>
</footer>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("message").textContent =
            "Login form validated. Backend connection is needed to authenticate your account.";
    });
</script>
<script src="js/main.js"></script>

</body>
</html>
