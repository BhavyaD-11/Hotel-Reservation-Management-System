<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | GrandStay</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .register-container {
            max-width: 480px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px #00000015;
        }

        .register-container h1 {
            text-align: center;
            color: #102a43;
            margin-bottom: 8px;
        }

        .register-container p {
            text-align: center;
            color: #667085;
            margin-bottom: 20px;
        }

        .register-container label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        .register-container input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .register-container button {
            width: 100%;
            margin-top: 22px;
        }

        .register-container .message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <nav class="navbar">
        <h2 class="logo">GrandStay</h2>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="rooms.html">Rooms</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<main class="register-container">
    <h1>Create Account</h1>
    <p>Register to book your perfect stay.</p>

    <form id="registerForm">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" pattern="[0-9]{10}"
               placeholder="10-digit phone number" required>

        <label for="password">Password</label>
        <input type="password" id="password" minlength="8" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" minlength="8" required>

        <button type="submit">Register</button>
        <p class="message" id="message" role="status"></p>
    </form>

    <p>Already have an account? <a href="login.html">Login here</a></p>
</main>

<footer>
    <p>&copy; 2026 GrandStay Hotel. All rights reserved.</p>
</footer>

<script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const message = document.getElementById("message");

        if (password !== confirmPassword) {
            message.textContent = "Passwords do not match!";
            message.style.color = "red";
            return;
        }

        message.textContent = "Form validated! Backend connection is needed to create your account.";
        message.style.color = "green";
    });
</script>
<script src="js/main.js"></script>

</body>
</html>
